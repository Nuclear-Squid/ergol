<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 300">

  <style>
    #left  { transform: translate(  4px, 10px); }
    #right { transform: translate(480px, 10px); }

    /* column stagger */

    .col_1 { transform: translate( 60px, 71.25px); }
    .col_2 { transform: translate(120px, 26.25px); }
    .col_3 { transform: translate(180px,     0px); }
    .col_4 { transform: translate(240px, 20.00px); }
    .col_5 { transform: translate(300px, 27.50px); }

    .col_6 { transform: translate(  0px, 27.50px); }
    .col_7 { transform: translate( 60px, 20.00px); }
    .col_8 { transform: translate(120px,     0px); }
    .col_9 { transform: translate(180px, 26.25px); }
    .col_0 { transform: translate(240px, 71.25px); }

    /* XXX these thumb clusters have been positioned with magic numbers */

    .thb_4 { transform: translate(280px, 203px); }
    .thb_5 { transform: translate(350px, 219px); }
    .thb_4 g { transform: rotate(12deg); }
    .thb_5 g { transform: rotate(24deg); }

    .thb_7 { transform: translate( 22px, 214px); }
    .thb_6 { transform: translate(-44px, 240px); }
    .thb_7 g { transform: rotate(-12deg); }
    .thb_6 g { transform: rotate(-24deg); }

    /* CSS theme, should be factorized somehow */

    :root {
      color-scheme: light dark;
    }

    rect {
      fill: #fff;
      stroke: #666;
      stroke-width: .5px;
    }
    .glyph {
      transform: scale(0.4) translate(-24px, -36px);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    text {
      fill: #444;
      font: normal 20px sans-serif;
      text-align: center;
      text-anchor: middle;
    }
    use {
      stroke: #444;
    }

    .specialKey rect { fill: #e4e4e4; }
    .specialKey text { font-size: 14px; }
    .shortcut        { font-size: 11px; }
    .mod             { font-size: 14px; }

    .dual { transform: translateY(26px); }
    .dual, .mod .dual { fill: #f4f4f4; }

    text.mod  { fill: #333; }
    text.sym  { fill: #66f; }
    text.nav  { fill: #e83; }
    use.nav { stroke: #e83; }

    .nav rect.mod { fill: #e83; }
    .nav text.mod { fill: brown; }
    .sym rect.mod { fill: #77d; }
    .sym text.mod { fill: navy; }

    .level1, .level2 { opacity: 0.8; }
    text.sym         { opacity: 0.6; }

    @media (prefers-color-scheme: dark) {
      .specialKey rect { fill: #333; }
      rect             { fill: #444; }
      text             { fill: #bbb; }
      use            { stroke: #bbb; }
      text.mod         { fill: #eee; }
      text.sym         { fill: #99f; }
      .dual,
      .mod .dual       { fill: #666; }
    }
  </style>

  <defs>
    <path class="glyph" id="glyph_backspace" d="M22,19l10,10 M22,29l10-10 M6,24l10,13h26v-26h-26z"/>
    <path class="glyph" id="glyph_delete"    d="M16,19l10,10 M16,29l10-10 M42,24l-10,13h-26v-26h26z"/>
    <path class="glyph" id="glyph_return"    d="M42,13V27H6 m8-8l-8,8l8,8"/>
    <path class="glyph" id="glyph_space"     d="M42,24V32H6V24"/>
    <path class="glyph" id="glyph_escape"    d="M24,24l-18-18 m0,10v-10h10 M24,6A18,18,0,1,1,6,24"/>
